name: Release

# Push a tag like v1.0.0 (must equal APP_VERSION in app/__init__.py) to build every
# installer and publish a GitHub Release. "Run workflow" builds the same files as
# downloadable workflow artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------- version
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('app/__init__.py').read()).group(1))")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $VERSION in app/__init__.py"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- tests
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  # ---------------------------------------------------------------- Windows x64 + ARM64
  build-windows:
    needs: [meta, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --clean PromptVault.spec
      - name: Smoke test the frozen app
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PROMPT_VAULT_HOME = Join-Path $env:RUNNER_TEMP "pv-smoke"
          $p = Start-Process -FilePath "dist\PromptVault\PromptVault.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }
          if (-not (Test-Path (Join-Path $env:PROMPT_VAULT_HOME "promptvault.db"))) { throw "Database was not created" }
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist\PromptVault -DestinationPath "release\PromptVault-${{ needs.meta.outputs.version }}-windows-${{ matrix.arch }}-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/PromptVault
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}-portable
          path: release/*.zip
          retention-days: 30

  # ---------------------------------------------------------------- Windows installers (Inno Setup)
  package-windows:
    needs: [meta, build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-windows-x64,   path: stage/x64 }
      - uses: actions/download-artifact@v4
        with: { name: dist-windows-arm64, path: stage/arm64 }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Compile installers
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          foreach ($arch in "x64", "arm64") {
            & $iscc "/DAppVersion=${{ needs.meta.outputs.version }}" "/DArch=$arch" "/DSourceDir=$PWD\stage\$arch" installer\PromptVault.iss
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $arch" }
          }
          Get-ChildItem release
      - name: Test silent install (x64)
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter "*windows-x64-setup.exe" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "pv-install"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\PromptVault.exe")) { throw "PromptVault.exe missing after install" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-installers
          path: release/*-setup.exe
          retention-days: 30

  # ---------------------------------------------------------------- macOS: Apple Silicon and Intel
  build-macos:
    needs: [meta, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: apple-silicon, runner: macos-15,       arch: arm64 }
          - { name: intel,         runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create virtualenv and install dependencies
        run: |
          "${PYBIN:-python}" -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Build .icns icon
        run: |
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icons/promptvault-1024.png --out "icon.iconset/icon_${s}x${s}.png" > /dev/null
            sips -z $((s*2)) $((s*2)) assets/icons/promptvault-1024.png --out "icon.iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns icon.iconset -o assets/icons/promptvault.icns

      - name: Build .app
        run: python -m PyInstaller --noconfirm --clean PromptVault.spec

      - name: Verify architecture and ad-hoc sign
        run: |
          APP="dist/Prompt Vault.app"
          BIN="$APP/Contents/MacOS/PromptVault"
          ARCHS=$(lipo -archs "$BIN")
          echo "Executable architectures: $ARCHS"
          case "${{ matrix.arch }}" in
            arm64)      [[ "$ARCHS" == "arm64" ]] || { echo "::error::expected arm64"; exit 1; } ;;
            x86_64)     [[ "$ARCHS" == "x86_64" ]] || { echo "::error::expected x86_64"; exit 1; } ;;
          esac
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Smoke test the frozen app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PROMPT_VAULT_HOME="$RUNNER_TEMP/pv-smoke"
          "dist/Prompt Vault.app/Contents/MacOS/PromptVault" --smoke-test
          test -f "$PROMPT_VAULT_HOME/promptvault.db"

      - name: Create DMG
        run: |
          mkdir -p release dmg-stage
          cp -R "dist/Prompt Vault.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Prompt Vault" -srcfolder dmg-stage -ov -format UDZO \
            "release/PromptVault-${{ needs.meta.outputs.version }}-macos-${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.name }}
          path: release/*.dmg
          retention-days: 30

  # ---------------------------------------------------------------- publish
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [meta, package-windows, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: files
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          cat > notes.md <<'NOTES'
          ## Downloads

          | Platform | File |
          |---|---|
          | Windows 10/11 · Intel/AMD 64-bit | `…windows-x64-setup.exe` (or `-portable.zip`) |
          | Windows 11 · ARM64 | `…windows-arm64-setup.exe` (or `-portable.zip`) |
          | macOS · Apple Silicon (M1+) | `…macos-apple-silicon.dmg` |
          | macOS · Intel | `…macos-intel.dmg` |

          Verify downloads with `SHA256SUMS.txt`.

          ### First launch
          These builds are not code-signed yet.
          - **Windows:** SmartScreen may warn. Click *More info* → *Run anyway*.
          - **macOS:** open the DMG, drag *Prompt Vault* to Applications, then right-click the app → *Open* the first time
            (or run `xattr -dr com.apple.quarantine "/Applications/Prompt Vault.app"`).

          Your data stays on your computer. No account, no analytics.

          © 2026 Sadroddin Aghaei. All Rights Reserved.
          NOTES
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          PRE=""; [[ "$VERSION" == *-* ]] && PRE="--prerelease"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" files/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" \
              --title "Prompt Vault $VERSION" --notes-file notes.md --verify-tag $PRE
          fi
